<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .login-card { max-width: 420px; margin: 80px auto; padding: 2rem; border-radius: 1rem; box-shadow: 0 16px 40px rgba(0,0,0,0.08); background: white; }
    .form-control:focus { box-shadow: none; border-color: #d32f2f; }
    .btn-primary { background: #d32f2f; border: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="login-card">
      <h1 class="h3 mb-3 fw-bold text-center">Admin Login</h1>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ 'danger' if category == 'error' else category }}" role="alert">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      <form method="post" action="{{ url_for('admin_login') }}">
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign In</button>
      </form>
      <p class="mt-3 text-center text-muted">Use the configured admin password to access the dashboard.</p>
    </div>
  </div>
</body>
</html>
